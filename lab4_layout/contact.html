
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Layout Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">

        <header>
            <h1>Layout Sederhana</h1>
        </header>

        <nav>
            <a href="home.html">Home</a>
            <a href="artikel.html">Artikel</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Kontak</a>
        </nav>

        <section id="hero">
            <h1>Contact Us</h1>
            <p>
                Silakan hubungi kami melalui formulir
                di bawah ini.
            </p>
        </section>

        <section id="main" class="single-layout">

            <article class="entry">
                <h2>Formulir Kontak</h2>
                <p>
                    Silakan isi data dengan lengkap dan benar.
                </p>

                <form action="#" method="post" class="contact-form">

                    <div class="form-group">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" name="nama"
                               placeholder="Masukkan nama lengkap"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email"
                               placeholder="Masukkan email"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="telepon">Nomor Telepon</label>
                        <input type="tel" id="telepon" name="telepon"
                               placeholder="Masukkan nomor telepon">
                    </div>

                    <div class="form-group">
                        <label for="subjek">Subjek</label>
                        <input type="text" id="subjek" name="subjek"
                               placeholder="Masukkan subjek"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message / Pesan</label>
                        <textarea id="message" name="message"
                                  rows="6"
                                  placeholder="Tuliskan pesan Anda"
                                  required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">
                        Kirim Pesan
                    </button>

                </form>
            </article>

        </section>

        <footer>
            <p>&copy; 2026 - Universitas Pelita Bangsa</p>
        </footer>

    </div>
</body>
</html>
